{% extends "_shell_admin.html" %}
{% block title %}Add a member{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <div class="eyebrow">Members</div>
    <h1>Add a member</h1>
    <p>Registering a new member issues them a permanent Member ID.</p>
  </div>
</div>

<div class="panel" style="max-width:560px;">
  <form method="post">
    <div class="plan-pick">
      <label class="plan-card">
        <input type="radio" name="plan" value="normal" checked>
        <strong>Normal</strong>
        <div class="plan-fee">₹{{ normal.fee }}<small style="font-weight:400; font-size:0.7rem;">/mo</small></div>
        <div class="help-text">{{ normal.book_limit }} books at a time</div>
      </label>
      <label class="plan-card">
        <input type="radio" name="plan" value="pro">
        <strong>Pro</strong>
        <div class="plan-fee">₹{{ pro.fee }}<small style="font-weight:400; font-size:0.7rem;">/mo</small></div>
        <div class="help-text">{{ pro.book_limit }} books · 50% off late fines</div>
      </label>
    </div>

    <div class="field">
      <label for="name">Full name</label>
      <input type="text" id="name" name="name" required>
    </div>
    <div class="form-row">
      <div class="field">
        <label for="email">Email <small>(optional)</small></label>
        <input type="email" id="email" name="email">
      </div>
      <div class="field">
        <label for="phone">Phone <small>(optional)</small></label>
        <input type="tel" id="phone" name="phone" placeholder="+91 XXXXX XXXXX">
      </div>
    </div>

    <div class="actions-row">
      <button type="submit" class="btn btn-primary">Create member</button>
    </div>
  </form>
</div>
{% endblock %}
