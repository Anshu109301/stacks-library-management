{% extends "_shell_admin.html" %}
{% block title %}Edit book{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <div class="eyebrow">Catalog</div>
    <h1>Edit '{{ book.name }}'</h1>
  </div>
</div>

<div class="panel" style="max-width:620px;">
  <form method="post">
    <div class="field">
      <label for="name">Title</label>
      <input type="text" id="name" name="name" value="{{ book.name }}" required>
    </div>
    <div class="form-row">
      <div class="field">
        <label for="author">Author</label>
        <input type="text" id="author" name="author" value="{{ book.author or '' }}">
      </div>
      <div class="field">
        <label for="isbn">ISBN</label>
        <input type="text" id="isbn" name="isbn" value="{{ book.isbn or '' }}">
      </div>
    </div>
    <div class="form-row">
      <div class="field">
        <label for="publisher">Publisher</label>
        <input type="text" id="publisher" name="publisher" value="{{ book.publisher or '' }}">
      </div>
      <div class="field">
        <label for="pub_year">Publication year</label>
        <input type="number" id="pub_year" name="pub_year" min="1400" max="2100" value="{{ book.pub_year or '' }}">
      </div>
    </div>
    <div class="form-row">
      <div class="field">
        <label for="price">Price (₹)</label>
        <input type="number" id="price" name="price" min="0" value="{{ book.price }}" required>
      </div>
      <div class="field">
        <label for="quantity">Copies in stock</label>
        <input type="number" id="quantity" name="quantity" min="0" value="{{ book.quantity }}" required>
      </div>
    </div>

    {% include "admin/_genre_picker.html" %}

    <div class="actions-row">
      <button type="submit" class="btn btn-primary">Save changes</button>
      <a href="{{ url_for('admin_books') }}" class="btn btn-outline">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
